name: Update EPG
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'build_epg.py'
      - 'test_build_epg.py'
      - 'channels.json'
      - 'sources.txt'
      - 'requirements.txt'
      - '.github/workflows/update-epg.yml'
permissions:
  contents: write
concurrency:
  group: update-epg
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
      - name: Check configured channels
        id: catalog
        run: |
          python -c "import json, os; ready = bool(json.load(open('channels.json'))); open(os.environ['GITHUB_OUTPUT'], 'a').write('ready=' + str(ready).lower() + '\\n'); print('Catalog configured:', ready)"
      - if: steps.catalog.outputs.ready == 'true'
        run: python build_epg.py
      - name: Store generated EPG
        if: steps.catalog.outputs.ready == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/epg.xml output/epg.xml.gz output/report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update XMLTV programming'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
